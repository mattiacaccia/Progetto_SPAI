[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "progetto_spai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "timm>=1.0.30",
    "transformers>=5.20.2",
    "ultralytics>=8.4.192",
    "scipy",        # matching ungherese della loss di DETR
    "lapx",         # associazione dati di ByteTrack
    "tqdm",
    "pyyaml",
    "matplotlib",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
]
